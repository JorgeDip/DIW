<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8º Ejercicio</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;

            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #eeeeee;

            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
        }

        h1 {
            padding: 2rem;
        }

        main {
            background-color: #fff;
            width: 30vw;
            border: 2px solid #928989;
            border-radius: 6px;
        }

        .form-group {
            display: flex;
            justify-content: start;
            align-items: center;
            padding: 1rem;
            gap: 5rem;
        }

        label {
            background-color: #9af0d9;
            min-width: 150px;

            color: #000;
            text-align: center;
            text-transform: uppercase;

            padding: 8px;
            border-radius: 6px;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 450px;
            padding: 8px;

            border-radius: 6px;
            border: 1px solid #928989;
        }

    </style>
</head>

<body>
    <h1>Formulario - Tarea 8</h1>

    <main>

        <form>
            <div class="form-group">
                <label for="first_name">First name</label>
                <input type="text" id="first_name" name="first_name" placeholder="Enter your first name here">
            </div>
            <div class="form-group">
                <label for="last_name">Last name</label>
                <input type="text" id="last_name" name="last_name" placeholder="Enter your last name here">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email here">
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" id="phone" name="phone" placeholder="Enter your phone number here">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" draggable="false"
                    placeholder="Enter your message here"></textarea>
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <div>
                    <input type="radio" id="age" name="age" value="20-29"> 20-29
                    <input type="radio" id="age" name="age" value="30-39"> 30-39
                    <input type="radio" id="age" name="age" value="40-49"> 40-49
                    <input type="radio" id="age" name="age" value="50-59"> 50-59
                    <input type="radio" id="age" name="age" value=">60"> >60
                </div>
            </div>
        </form>

    </main>

</body>

</html>
