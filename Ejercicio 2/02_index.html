<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2º Ejercicio</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        header {
            background-color: #008080;
            display: flex;
            justify-content: space-between;

            padding: 10px;
        }

        ul {
            display: flex;
            align-items: center;
            gap: 1rem;
            list-style: none;
        }

        ul li {
            color: white;
        }

        ul li#logo {
            font-size: 18px;
        }

        button {
            color: #05cccc;
            padding: 2px 10px;

            border: 1px solid #05cccc;
            border-radius: 50px;
        }

    </style>
</head>

<body>

    <header>
        <nav>
            <ul>
                <li id="logo">Logo</li>
                <li>Enlace 1</li>
                <li>Enlace 2</li>
                <li>Enlace 3</li>
                <li>Enlace 4</li>
            </ul>
        </nav>

        <div>
            <input type="text"> <button>Go</button>
        </div>

    </header>

</body>

</html>
