<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1º Ejercicio</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        header {
            background-color: #2d2d2d;
            display: flex;
            flex-direction: column;
        }

        h1 {
            padding: 1rem;
            color: #fff;
        }

        ul {
            background-color: gray;
            display: flex;
            justify-content: space-around;
            list-style: none;
        }

        ul li {
            padding: 1rem;
            border: 1px solid #fff;
        }

    </style>
</head>

<body>

    <header>
        <h1>Flexbox</h1>
        <ul>
            <li>Enlace 1</li>
            <li>Enlace 2</li>
            <li>Enlace 3</li>
            <li>Enlace 4</li>
        </ul>
    </header>

</body>

</html>
