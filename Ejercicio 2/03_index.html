<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3º Ejercicio</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        header {
            background-color: #2d2d2d;
            display: flex;
            flex-direction: column;
        }

        h1 {
            padding: 1rem;
            color: #fff;
        }

        main {
            background-color: gray;
            padding: 12px;

            display: flex;
            justify-content: space-between;
            gap: 1rem;
        }

        main .imagen {
            border: 1px solid #646464;
            padding: 12px;
        }

        main .imagen img {
            width: 200px;
        }

    </style>
</head>

<body>

    <header>
        <h1>Flexbox: Catálogo de imágenes</h1>
    </header>

    <main>
        <div class="imagen"><img src="img/edificios/1076-600x400.jpg" alt=""></div>
        <div class="imagen"><img src="img/edificios/1081-600x400.jpg" alt=""></div>
        <div class="imagen"><img src="img/edificios/743-600x400.jpg" alt=""></div>
        <div class="imagen"><img src="img/edificios/870-600x400.jpg" alt=""></div>
        <div class="imagen"><img src="img/edificios/945-600x400.jpg" alt=""></div>
    </main>

</body>

</html>
